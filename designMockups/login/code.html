    class="bg-surface font-body text-on-surface antialiased selection:bg-secondary-container selection:text-on-secondary-container"
  >
    <!-- Suppression of Navigation Shell for Transactional Context (Login) -->
    <main class="min-h-screen flex flex-col justify-center items-center px-6 py-12">
      <div class="w-full max-w-[420px]">
        <!-- Branding Anchor -->
        <div class="mb-12 text-center md:text-left">
          <div class="flex items-center justify-center md:justify-start gap-3 mb-6">
            <div
              class="w-12 h-12 rounded-xl signature-gradient flex items-center justify-center text-white"
            >
              <span
                class="material-symbols-outlined text-2xl"
                style="font-variation-settings: &#39;FILL&#39; 1;"
                >document_scanner</span
              >
            </div>
            <span class="font-headline font-bold text-3xl tracking-tighter text-primary"
              >ReceiptLens</span
            >
          </div>
          <h1 class="font-headline text-3xl font-extrabold tracking-tight text-primary mb-2">
            Welcome back.
          </h1>
          <p class="text-on-surface-variant font-medium">
            Step back into your curated financial world.
          </p>
        </div>
        <!-- Login Form -->
        <div class="space-y-6">
          <!-- Input Group: Email -->
          <div class="space-y-2">
            <label
              class="font-label text-xs font-semibold uppercase tracking-widest text-on-surface-variant ml-1"
              >Email Address</label
            >
            <div class="relative group">
              <input
                class="w-full h-12 px-5 bg-surface-container-low border-none rounded-xl text-on-surface font-medium placeholder:text-outline/50 focus:ring-2 focus:ring-primary/5 focus:bg-surface-container-high transition-all outline-none"
                placeholder="alex@receiptlens.ai"
                type="email"
              />
              <div
                class="absolute inset-0 border border-outline-variant/15 rounded-xl pointer-events-none group-focus-within:border-outline-variant/40"
              ></div>
            </div>
          </div>
          <!-- Input Group: Password -->
          <div class="space-y-2">
            <div class="flex justify-between items-end px-1">
              <label
                class="font-label text-xs font-semibold uppercase tracking-widest text-on-surface-variant"
                >Password</label
              >
              <a
                class="text-xs font-bold text-secondary hover:underline underline-offset-4 transition-all"
                href="#"
                >Forgot?</a
              >
            </div>
            <div class="relative group">
              <input
                class="w-full h-12 px-5 bg-surface-container-low border-none rounded-xl text-on-surface font-medium placeholder:text-outline/50 focus:ring-2 focus:ring-primary/5 focus:bg-surface-container-high transition-all outline-none"
                placeholder="••••••••"
                type="password"
              />
              <div
                class="absolute inset-0 border border-outline-variant/15 rounded-xl pointer-events-none group-focus-within:border-outline-variant/40"
              ></div>
            </div>
          </div>
          <!-- Primary CTA -->
          <button
            class="w-full h-12 signature-gradient text-on-primary font-headline font-bold rounded-xl shadow-lg shadow-primary/10 active:scale-[0.98] transition-all hover:opacity-95 flex items-center justify-center gap-2"
          >
            Continue
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
          </button>
        </div>
        <!-- Divider -->
        <div class="relative my-10 flex items-center">
          <div class="flex-grow border-t border-outline-variant/20"></div>
          <span
            class="flex-shrink mx-4 font-label text-[10px] font-bold uppercase tracking-[0.2em] text-outline/60"
            >Authentication Proxy</span
          >
          <div class="flex-grow border-t border-outline-variant/20"></div>
        </div>
        <!-- Social Logins -->
        <div class="grid grid-cols-2 gap-4">
          <button
            class="flex items-center justify-center gap-3 h-12 bg-surface-container-lowest border border-outline-variant/20 rounded-xl font-headline font-bold text-sm text-primary hover:bg-surface-container-low active:scale-95 transition-all editorial-shadow"

            />

            class="flex items-center justify-center gap-3 h-12 bg-surface-container-lowest border border-outline-variant/20 rounded-xl font-headline font-bold text-sm text-primary hover:bg-surface-container-low active:scale-95 transition-all editorial-shadow"

        <!-- Footer Link -->
        <p class="mt-12 text-center text-sm font-medium text-on-surface-variant">
          New to the Lens?
          <a
            class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-secondary/30 transition-all"
            href="#"
            >Create an account</a

        </p>
      </div>
