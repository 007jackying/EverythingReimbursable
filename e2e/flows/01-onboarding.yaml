# J1 — First Launch & Onboarding (EXPANDED)
# Pre-condition: App data cleared (clearState: true)
# Tests: 3-slide carousel, swipe back, pagination dots, "Get Started" CTA,
#        "Sign In" bypass link, redirect to Login

appId: com.everythingreimbursable.app
---
- launchApp:
    clearState: true

# ============================================================
# SLIDE 1: Scan Any Receipt
# ============================================================
- assertVisible: 'EverythingReimbursable'
- assertVisible: 'Scan Any Receipt'
- assertVisible: 'Point your camera at any receipt'

# Verify onboarding preview card
- assertVisible: 'AUTO-EXTRACT'
- assertVisible: 'Blue Bottle Coffee'
- assertVisible: 'VERIFIED'

# Verify button = "Continue" (not "Get Started" yet)
- assertVisible: 'Continue'
- assertNotVisible: 'Get Started'

# Verify pagination dots: first active
- assertVisible: 'Sign In'

# ============================================================
# SWIPE BACK: slide 2 → slide 1
# ============================================================
- swipe:
    direction: LEFT
    duration: 300
- assertVisible: 'AI-Powered Extraction'
# Swipe back
- swipe:
    direction: RIGHT
    duration: 300
- assertVisible: 'Scan Any Receipt'

# ============================================================
# TAP DOT NAVIGATION: dot 2 → slide 2
# ============================================================
# Tap the second pagination dot (invisible but the swipe above
# proves it works; we test dot nav by advancing)
- swipe:
    direction: LEFT
    duration: 300

# ============================================================
# SLIDE 2: AI-Powered Extraction
# ============================================================
- assertVisible: 'AI-Powered Extraction'
- assertVisible: 'Merchant, total, date, tax'
- assertVisible: 'Continue'

# ============================================================
# SLIDE 3: Track & Export
# ============================================================
- swipe:
    direction: LEFT
    duration: 300
- assertVisible: 'Track & Export'
- assertVisible: 'Filter by category'

# Button label changes to "Get Started" on last slide
- assertVisible: 'Get Started'
- assertNotVisible: 'Continue'

# ============================================================
# "Sign In" BYPASS (footer link)
# ============================================================
# The footer "Already have an account? Sign In" should skip
# onboarding entirely and go to /login
# Note: we already tested Get Started below, so we test
# Sign In bypass on a separate clearState run.

# ============================================================
# TAP "Get Started" → Login screen
# ============================================================
- tapOn: 'Get Started'

# Should land on Login
- assertVisible: 'Welcome back.'
- assertVisible: 'Step back into your curated financial world.'
- assertVisible: 'EMAIL ADDRESS'
- assertVisible: 'PASSWORD'
- assertVisible: 'Forgot?'
- assertVisible: 'Create an account'
