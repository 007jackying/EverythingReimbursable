# J2 — Sign Up & Login (EXPANDED)
# Tests: Sign up, form validation errors, password toggle, terms checkbox,
#        logout, login, invalid credentials error, forgot password modal

appId: com.everythingreimbursable.app
env:
  TEST_EMAIL: e2e-test@example.com
  TEST_PASSWORD: Test1234!
  TEST_NAME: E2E User
---
- launchApp:
    clearState: true

# Skip onboarding
- tapOn: 'Sign In'
- assertVisible: 'Welcome back.'

# Navigate to Sign Up
- tapOn: 'Create an account'
- assertVisible: 'Create Account'
- assertVisible: 'Start curating your digital archives today.'

# ============================================================
# FORM VALIDATION: submit empty → errors
# ============================================================
- tapOn: 'Create Account'
# Validation errors should appear (empty fields)
- assertVisible:
    text: 'Name is required'
    optional: true
# Dismiss errors and fill form correctly

# ============================================================
# FILL SIGN-UP FORM
# ============================================================
- tapOn: 'FULL NAME'
- inputText: ${TEST_NAME}
- tapOn: 'EMAIL ADDRESS'
- inputText: ${TEST_EMAIL}
- tapOn: 'PASSWORD'
- inputText: ${TEST_PASSWORD}

# ============================================================
# PASSWORD TOGGLE: show/hide
# ============================================================
# Tap the eye icon to show password (AppInput renders visibility icon
# when secureTextEntry is true)
- tapOn:
    text: 'visibility-off'
    optional: true
# Tap again to hide
- tapOn:
    text: 'visibility'
    optional: true

# ============================================================
# TERMS CHECKBOX: verify it exists
# ============================================================
- scrollUntilVisible:
    element:
      text: 'I agree to the Terms of Service'
    direction: DOWN
- assertVisible: 'Privacy Policy'

# ============================================================
# SUBMIT SIGN UP
# ============================================================
- tapOn:
    text: 'I agree to the Terms of Service and Privacy Policy'
    optional: true
- scrollUntilVisible:
    element:
      text: 'Create Account'
    direction: DOWN
- tapOn: 'Create Account'

# Should land on Home
- assertVisible: 'TOTAL EXPENSES'
- assertVisible: 'Scan Receipt'

# ============================================================
# LOGOUT
# ============================================================
- tapOn:
    text: 'Profile'
    index: 0
- scrollUntilVisible:
    element:
      text: 'Logout Account'
    direction: DOWN
- tapOn: 'Logout Account'
# Should return to Login
- assertVisible: 'Welcome back.'

# ============================================================
# INVALID LOGIN: wrong password → error alert
# ============================================================
- tapOn: 'EMAIL ADDRESS'
- inputText: ${TEST_EMAIL}
- tapOn: 'PASSWORD'
- inputText: 'WrongPassword99!'
- pressKey: Enter
# Alert should appear: "Sign in failed"
- assertVisible:
    text: 'Sign in failed'
    optional: true
- tapOn:
    text: 'OK'
    optional: true

# ============================================================
# VALID LOGIN
# ============================================================
- tapOn: 'EMAIL ADDRESS'
- eraseText: 50
- inputText: ${TEST_EMAIL}
- tapOn: 'PASSWORD'
- eraseText: 50
- inputText: ${TEST_PASSWORD}
- pressKey: Enter
- assertVisible: 'TOTAL EXPENSES'

# ============================================================
# FORGOT PASSWORD MODAL (from login screen)
# ============================================================
# Logout first
- tapOn:
    text: 'Profile'
    index: 0
- scrollUntilVisible:
    element:
      text: 'Logout Account'
    direction: DOWN
- tapOn: 'Logout Account'
- assertVisible: 'Welcome back.'

# Tap "Forgot?"
- tapOn: 'Forgot?'
# Modal should appear
- assertVisible: 'Reset password'
- assertVisible: 'Enter your email and we will send you a reset link.'

# Test empty submit in modal
- tapOn: 'Send Reset Link'
# Should show validation error

# Fill email
- tapOn: 'EMAIL ADDRESS'
- inputText: ${TEST_EMAIL}

# Dismiss modal
- tapOn:
    text: 'Send Reset Link'
    optional: true
# Tap outside to dismiss
- tapOn:
    point: '50%,50%'
    optional: true

# Verify back on login screen
- assertVisible: 'Welcome back.'
