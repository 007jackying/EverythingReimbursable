# J3 — Core Navigation & Tab Bar (EXPANDED)
# Tests: Tab switching (Home/History/Profile), empty states,
#        pull-to-refresh on Home, greeting, "View All" link,
#        "View Insights" button

appId: com.everythingreimbursable.app
env:
  TEST_EMAIL: e2e-test@example.com
  TEST_PASSWORD: Test1234!
---
- launchApp:
    clearState: false

# Login
- assertVisible: 'Welcome back.'
- tapOn: 'EMAIL ADDRESS'
- inputText: ${TEST_EMAIL}
- tapOn: 'PASSWORD'
- inputText: ${TEST_PASSWORD}
- pressKey: Enter

# ============================================================
# HOME TAB
# ============================================================
- assertVisible: 'TOTAL EXPENSES'

# Verify greeting text
- assertVisible:
    text: 'Ready to organize your finances?'
    optional: true

# Verify quick action buttons
- assertVisible: 'Scan Receipt'
- assertVisible: 'Upload Photo'

# Verify SummaryCard sections
- assertVisible: 'TOTAL EXPENSES'
# AI accuracy row should be hidden when no receipts (Session 13 change)
- assertNotVisible: 'AI Accuracy'

# Verify empty state
- assertVisible: 'Recent Receipts'
- assertVisible: 'No receipts yet'
- assertVisible: 'Scan your first receipt'

# "View All" link (should exist even when empty — leads to History)
- assertVisible: 'View All'

# Tap "View Insights" on summary card (navigates to History)
- scrollUntilVisible:
    element:
      text: 'View Insights'
    direction: UP
- tapOn:
    text: 'View Insights'
    optional: true
# Should be on History
- assertVisible: 'History'
# Navigate back to Home
- tapOn:
    text: 'Home'
    index: 0

# ============================================================
# PULL-TO-REFRESH: swipe down
# ============================================================
# Pull down from top to trigger RefreshControl
- swipe:
    start: '50%,20%'
    end: '50%,60%'
    duration: 500
# App should still be on Home
- assertVisible: 'TOTAL EXPENSES'

# ============================================================
# HISTORY TAB
# ============================================================
- tapOn:
    text: 'History'
    index: 0
- assertVisible: 'History'
- assertVisible: 'Your digital archive of curated expenses.'

# Empty state (if no receipts exist)
- assertVisible:
    text: 'No receipts yet'
    optional: true
- assertVisible:
    text: 'Scan Receipt'
    optional: true

# Filter tabs
- assertVisible: 'All'
- assertVisible: 'This Month'
- assertVisible: 'By Category'
- assertVisible: 'Filters'

# Search bar
- assertVisible: 'Search receipts...'

# ============================================================
# PROFILE TAB
# ============================================================
- tapOn:
    text: 'Profile'
    index: 0

# Profile header with name
- assertVisible:
    text: ${TEST_NAME}
    optional: true

# Stats cards
- scrollUntilVisible:
    element:
      text: 'RECEIPTS SCANNED'
    direction: DOWN
- assertVisible: 'CONFIDENCE'

# Settings section
- scrollUntilVisible:
    element:
      text: 'PREFERENCES & SECURITY'
    direction: DOWN

# Settings rows
- assertVisible: 'Notifications'
- assertVisible: 'Google Drive'
- assertVisible: 'Currency'
- assertVisible: 'Export Data'

# Logout button
- scrollUntilVisible:
    element:
      text: 'Logout Account'
    direction: DOWN

# Help section
- assertVisible: 'Need Help?'
- assertVisible: 'Contact'

# ============================================================
# RETURN TO HOME
# ============================================================
- tapOn:
    text: 'Home'
    index: 0
- assertVisible: 'TOTAL EXPENSES'
