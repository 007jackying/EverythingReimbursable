# J5 — History, Filters, Search & Export (EXPANDED)
# Tests: All filter tabs, filter sheet (status filters), search,
#        search no results, clear search, CSV export,
#        "Scan Receipt" button in empty state
# NOTE: If receipts exist, this flow tests real data paths.
#       If no receipts, it tests empty states gracefully.

appId: com.everythingreimbursable.app
env:
  TEST_EMAIL: e2e-test@example.com
  TEST_PASSWORD: Test1234!
---
- launchApp:
    clearState: false

# Login
- assertVisible: 'Welcome back.'
- tapOn: 'EMAIL ADDRESS'
- inputText: ${TEST_EMAIL}
- tapOn: 'PASSWORD'
- inputText: ${TEST_PASSWORD}
- pressKey: Enter
- assertVisible: 'TOTAL EXPENSES'

# Navigate to History
- tapOn:
    text: 'History'
    index: 0
- assertVisible: 'History'

# ============================================================
# FILTER TAB: "All" (default, active)
# ============================================================
- assertVisible: 'All'

# ============================================================
# FILTER TAB: "This Month"
# ============================================================
- tapOn: 'This Month'
# Content filters to current month only
# May show empty state if no receipts this month
- assertVisible:
    text: 'No receipts yet'
    optional: true
- assertVisible:
    text: 'You have not added any receipts this month.'
    optional: true

# ============================================================
# FILTER TAB: "By Category"
# ============================================================
- tapOn: 'By Category'
# Receipts grouped by category (TimelineHeader shows category names)

# ============================================================
# FILTER TAB: "Filters" → opens FilterSheet
# ============================================================
- scrollUntilVisible:
    element:
      text: 'Filters'
    direction: UP
- tapOn: 'Filters'
# FilterSheet bottom sheet should appear
- assertVisible: 'Filter Receipts'
- assertVisible: 'STATUS'
- assertVisible: 'All Statuses'
- assertVisible: 'Verified'
- assertVisible: 'Pending'
- assertVisible: 'Failed'

# Select "Verified" status filter
- tapOn: 'Verified'
# Tap "Apply Filters"
- tapOn: 'Apply Filters'
# Filter sheet closes; active Filter tab shows "Status: VERIFIED"

# Re-open filter sheet and select "Pending"
- tapOn:
    text: 'Filters'
    optional: true
# The tab text may have changed to show status
- tapOn:
    text: 'All'
    optional: true
- tapOn:
    text: 'Filters'
- assertVisible: 'Filter Receipts'
- tapOn: 'Pending'
- tapOn: 'Apply Filters'

# Clear all filters
- tapOn: 'Filters'
- assertVisible: 'Filter Receipts'
- tapOn: 'Clear All'

# ============================================================
# RESET: back to "All"
# ============================================================
- tapOn: 'All'
# Restore unfiltered view

# ============================================================
# SEARCH
# ============================================================
- tapOn: 'Search receipts...'
- inputText: 'Coffee'

# Verify search results or "No results found" empty state
- assertVisible:
    text: 'No results found'
    optional: true
- assertVisible:
    text: 'No receipts match'
    optional: true

# Clear search via X button
- tapOn:
    text: 'close'
    optional: true
# If no close icon visible, clear by erasing text
- tapOn: 'Search receipts...'
- eraseText: 20

# Search that will return no results
- tapOn: 'Search receipts...'
- inputText: 'ZZZZNOTFOUNDZZZZ'
- assertVisible:
    text: 'No results found'
    optional: true

# Clear search
- tapOn: 'Search receipts...'
- eraseText: 50

# ============================================================
# EXPORT CSV
# ============================================================
- scrollUntilVisible:
    element:
      text: 'Export History'
    direction: DOWN
- assertVisible: 'Export History'
- assertVisible: 'Download a detailed report'

# Tap "Download Report"
- tapOn: 'Download Report'
# Share sheet appears; dismiss it
- assertVisible:
    text: 'Cancel'
    optional: true
- tapOn:
    text: 'Cancel'
    optional: true
# On iOS, dismiss system share sheet by tapping outside
- tapOn:
    point: '50%,60%'
    optional: true
