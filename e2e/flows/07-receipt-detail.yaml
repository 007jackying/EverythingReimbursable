# J7 — Receipt Detail: View, Edit & Save
# Tests: Navigation from History list, receipt card rendering,
#        inline edit (merchant name, amount), save changes,
#        delete receipt from detail, back navigation,
#        "Receipt Not Found" error state
# Pre-condition: At least one receipt must exist

appId: com.everythingreimbursable.app
env:
  TEST_EMAIL: e2e-test@example.com
  TEST_PASSWORD: Test1234!
---
- launchApp:
    clearState: false

# Login
- assertVisible: 'Welcome back.'
- tapOn: 'EMAIL ADDRESS'
- inputText: ${TEST_EMAIL}
- tapOn: 'PASSWORD'
- inputText: ${TEST_PASSWORD}
- pressKey: Enter
- assertVisible: 'TOTAL EXPENSES'

# ============================================================
# NAVIGATE TO RECEIPT DETAIL from History
# ============================================================
- tapOn:
    text: 'History'
    index: 0
- assertVisible: 'History'

# Tap the first receipt in the list (if any exist)
# Receipts show merchant name as primary text
# If no receipts, this flow gracefully skips
- runFlow:
    when:
      notVisible: 'No receipts yet'
    file: subflows/receipt-detail-actions.yaml
    optional: true

# If no receipts, test the "Scan Receipt" button in empty state
- runFlow:
    when:
      visible: 'No receipts yet'
    file: subflows/receipt-empty-state.yaml
    optional: true
