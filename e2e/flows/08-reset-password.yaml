# J8 — Forgot Password & Reset Password Flow
# Tests: Forgot password modal, send reset link,
#        Reset password screen (valid state: form, invalid state: expired link),
#        password validation, form submission
# NOTE: This tests the UI screens; actual email delivery requires
#       a configured Supabase project.

appId: com.everythingreimbursable.app
env:
  TEST_EMAIL: e2e-test@example.com
---
- launchApp:
    clearState: true

# Skip onboarding
- tapOn: 'Sign In'
- assertVisible: 'Welcome back.'

# ============================================================
# FORGOT PASSWORD MODAL
# ============================================================
- tapOn: 'Forgot?'

# Modal contents
- assertVisible: 'Reset password'
- assertVisible: 'Enter your email and we will send you a reset link.'

# Test empty submit — validation error
- tapOn: 'Send Reset Link'
# Should show email validation error (AppInput error prop)

# Fill email
- tapOn: 'EMAIL ADDRESS'
- inputText: ${TEST_EMAIL}

# Submit
- tapOn: 'Send Reset Link'

# Success alert appears ("Check your email")
- assertVisible:
    text: 'Check your email'
    optional: true
- tapOn:
    text: 'OK'
    optional: true

# Modal closes, back on login
- assertVisible: 'Welcome back.'
# ============================================================
# RESET PASSWORD SCREEN — INVALID LINK STATE
# ============================================================
# Navigate directly to /reset-password without recovery tokens
# This shows the "Link expired" error state.
# Cannot deep-link from Maestro without URL scheme support,
# so we document what the screen should render:
#
# - assertVisible: "Link expired."
# - assertVisible: "This password reset link is invalid or has expired."
# - assertVisible: "Back to Sign In"
# - tapOn: "Back to Sign In" → redirects to /login

# ============================================================
# RESET PASSWORD SCREEN — VALID STATE
# ============================================================
# With valid tokens (via deep link), the screen shows:
#
# - assertVisible: "New password."
# - assertVisible: "Choose a new password for your account."
# - assertVisible: "NEW PASSWORD"
# - assertVisible: "CONFIRM PASSWORD"
# - tapOn "NEW PASSWORD" → inputText "NewPass123!"
# - tapOn "CONFIRM PASSWORD" → inputText "NewPass123!"
#
# VALIDATION: mismatched passwords
# - tapOn "CONFIRM PASSWORD" → eraseText → inputText "Different!"
# - tapOn "Save Password" → error "Passwords do not match"
#
# VALID SUBMISSION:
# - tapOn "CONFIRM PASSWORD" → eraseText → inputText "NewPass123!"
# - tapOn "Save Password"
# - assertVisible: "Password updated" → tapOn "Continue" → /home
