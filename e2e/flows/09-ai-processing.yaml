# J9 — AI Processing Screen States
# Tests: Loading state (scan beam, progress bar, confidence ring),
#        "Extracting receipt details..." heading, sub-text,
#        Gemini model label, bank-grade privacy badge,
#        drive upload status indicator, error state alert
# NOTE: This flow requires EXPO_PUBLIC_GEMINI_API_KEY to be set
#       for the real AI extraction path. Without it, the screen
#       will show an error alert.

appId: com.everythingreimbursable.app
env:
  TEST_EMAIL: e2e-test@example.com
  TEST_PASSWORD: Test1234!
---
- launchApp:
    clearState: false

# Login
- assertVisible: 'Welcome back.'
- tapOn: 'EMAIL ADDRESS'
- inputText: ${TEST_EMAIL}
- tapOn: 'PASSWORD'
- inputText: ${TEST_PASSWORD}
- pressKey: Enter
- assertVisible: 'TOTAL EXPENSES'

# Open camera via "Upload Photo" (gallery picker works on simulator
# without needing a real camera)
- tapOn: 'Upload Photo'
# Select an image from gallery (simulator photo library)
# Note: Maestro can't reliably select gallery images on all simulators.
# This flow documents the expected screen states.
# To manually test: tap a photo in the gallery picker.

# ============================================================
# AI PROCESSING SCREEN — LOADING STATE
# ============================================================
# After selecting an image, the app navigates to /ai-processing
#
# - assertVisible: "Extracting receipt details..."
# - assertVisible: "AI is identifying merchants, totals, and line items."
#
# Progress bar is visible (animated)
# - assertVisible: "CONFIDENCE"
# - assertVisible: "—" (initial confidence, before extraction completes)
# - assertVisible: "PROCESSING"
# - assertVisible: "Gemini"
#
# Bank-grade privacy badge
# - assertVisible: "BANK-GRADE ENCRYPTION ACTIVE"
# - assertVisible: "Your receipt data is encrypted and never shared with third parties."

# ============================================================
# AI PROCESSING — EXTRACTION COMPLETE STATE
# ============================================================
# After extraction:
# - assertVisible: "Analyzing..." (or merchant name, once extracted)
# - Confidence updates from "—" to a percentage (e.g., "98.4%")
# - Detected amount card appears
# - "VERIFIED" pill appears next to merchant name
#
# After extraction completes, navigates automatically to /receipt-detail

# ============================================================
# AI PROCESSING — ERROR STATE
# ============================================================
# If Gemini API key is missing/invalid:
# - Alert: "Extraction Failed"
# - Alert message: "We could not read this receipt."
# - Options: "Re-scan" and "Go Back"
#
# - tapOn: "Go Back" → returns to previous screen

# ============================================================
# AI PROCESSING — DRIVE UPLOAD INDICATOR
# ============================================================
# If Google Drive is connected:
# - Shows status text: "Uploading to Drive..." → "Uploaded ✓"
# If Drive upload fails:
# - Shows "Upload failed"
# - Alert: "Drive Upload Failed"
