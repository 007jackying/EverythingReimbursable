# Subflow: Receipt Detail — full view/edit/save/delete
appId: com.everythingreimbursable.app
---
# Tap the first receipt item (merchant name is companyName text)
# We can't know the exact merchant name, so we tap the first item
# in the SectionList by tapping a known area
- tapOn:
    point: '50%,25%'
    optional: true

# Should navigate to Receipt Detail screen
- assertVisible: 'VALIDATION STAGE'
- assertVisible: 'Review Receipt'

# ============================================================
# VIEW: verify card contents
# ============================================================
- assertVisible: 'AI VERIFIED'
- assertVisible: 'GRAND TOTAL'
- assertVisible: 'DATE'
- assertVisible: 'PAYMENT'
- assertVisible: 'CATEGORY'
- assertVisible: 'TAX'

# ============================================================
# INLINE EDIT: toggle edit mode
# ============================================================
# Tap edit icon (check-circle icon in header)
- tapOn:
    point: '90%,8%'
    optional: true
# Edit mode: TextInput replaces merchant name, amount becomes editable
# Verify the Edit and Re-scan buttons at bottom
- scrollUntilVisible:
    element:
      text: 'Edit'
    direction: DOWN

# Tap Edit to explicitly enter edit mode
- tapOn: 'Edit'

# Edit merchant name
- tapOn:
    text: 'Merchant name'
    optional: true
- eraseText: 50
- inputText: 'Edited Merchant Name'

# Dismiss keyboard
- pressKey: Enter

# ============================================================
# SAVE CHANGES
# ============================================================
- scrollUntilVisible:
    element:
      text: 'Save Receipt'
    direction: DOWN
- tapOn: 'Save Receipt'
# Navigates to Home after save
- assertVisible: 'TOTAL EXPENSES'

# ============================================================
# RE-OPEN & DELETE from detail screen
# ============================================================
- tapOn:
    text: 'History'
    index: 0

# Tap the receipt we edited
- tapOn: 'Edited Merchant Name'

# Verify we're on the detail screen
- assertVisible: 'Review Receipt'

# Tap delete icon in header (trash icon, only for saved receipts)
- tapOn:
    text: 'delete-outline'
    optional: true
# If no trash icon visible (it's an icon-only button without text)
# Try tapping the header area
- tapOn:
    point: '15%,5%'
    optional: true

# Confirm delete alert
- runFlow:
    when:
      visible: 'Delete'
    file: subflows/confirm-delete.yaml
    optional: true

# Should navigate to History after delete
- assertVisible: 'History'

# ============================================================
# BACK NAVIGATION: from detail to previous screen
# ============================================================
# Open another receipt if any remain, then press back
- tapOn:
    point: '50%,30%'
    optional: true
- runFlow:
    when:
      visible: 'Review Receipt'
    commands:
      - swipe:
          start: '5%,50%'
          end: '80%,50%'
          duration: 300
    optional: true
# Should be back on History
- assertVisible: 'History'

# Navigate back to Home via tab
- tapOn:
    text: 'Home'
    index: 0
- assertVisible: 'TOTAL EXPENSES'
# ============================================================
# RECEIPT NOT FOUND: verify error state
# ============================================================
# (This can only be tested by navigating to a receipt ID that
#  doesn't exist, which requires URL manipulation. Skip in UI flow.)
