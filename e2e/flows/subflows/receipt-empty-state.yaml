# Subflow: Empty state — tap "Scan Receipt" from History empty state
appId: com.everythingreimbursable.app
---
# Verify empty state elements
- assertVisible: 'No receipts yet'
- assertVisible: 'Scan your first receipt to get started.'

# Tap the "Scan Receipt" button in the empty state
- tapOn: 'Scan Receipt'
# Should navigate to camera
- assertVisible: 'SINGLE'

# Go back
- swipe:
    start: '5%,50%'
    end: '80%,50%'
    duration: 300
- assertVisible: 'History'
